# Base configuration - shared settings
languageCode = 'en-us'
title = 'Taubyte Blog'
theme = 'PaperMod'
googleAnalytics = 'G-VVFE939YJ3'
buildFuture = true

[outputs]
home = ["HTML", "RSS", "JSON"]

[params]
# Theme-specific parameters
title = "Taubyte Blog"
description = "Official Taubyte blog featuring updates, tutorials, and insights from distributed computing and edge technology"
keywords = ["Taubyte", "Blog", "Distributed Computing", "Edge Technology", "Cloud Native"]
author = "Taubyte"
DateFormat = "January 2, 2006"
defaultTheme = "dark" # dark, light
disableThemeToggle = true

ShowReadingTime = true
ShowShareButtons = false
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = false
ShowWordCount = true
ShowRssButtonInSectionTermList = true
UseHugoToc = true
disableSpecial1stPost = false
disableScrollToTop = false
comments = false
hidemeta = false
hideSummary = false
showtoc = false
tocopen = false

[params.assets]
# disableHLJS = true # to disable highlight.js
# disableFingerprinting = true

[params.label]
text = "Taubyte"

# profile-mode
[params.profileMode]
enabled = false # needs to be explicitly set
title = "Taubyte"
subtitle = "Distributed Computing & Edge Technology"
imageUrl = "<title or url>"
imageWidth = 120
imageHeight = 120
imageTitle = "Taubyte Logo"

[[params.profileMode.buttons]]
name = "Posts"
url = "/posts"

[[params.profileMode.buttons]]
name = "Tags"
url = "/tags"

# home-info mode
[params.homeInfoParams]
Title = "Welcome to Taubyte Blog"
Content = "Stay updated with the latest news, tutorials, and insights from the Taubyte team"

[[params.socialIcons]]
name = "twitter"
url = "https://twitter.com/dtaubyte"

[[params.socialIcons]]
name = "instagram"
url = "https://instagram.com/dtaubyte"

[[params.socialIcons]]
name = "github"
url = "https://github.com/taubyte"

[[params.socialIcons]]
name = "discord"
url = "https://discord.gg/4agEDXuf"

[[params.socialIcons]]
name = "linkedin"
url = "https://www.linkedin.com/company/taubyte-page"

[params.schema]
publisherType = "Organization"
sameAs = [
  "https://www.linkedin.com/company/taubyte-page",
  "https://www.crunchbase.com/organization/taubyte",
  "https://github.com/taubyte",
  "https://twitter.com/dtaubyte",
  "https://instagram.com/dtaubyte",
  "https://discord.gg/4agEDXuf",
  "https://tau.how"
]

[params.schema.organization]
name = "Taubyte"
legalName = "TAUBYTE INC"
url = "https://taubyte.com"
foundingDate = "2019"
description = "Taubyte builds a full-stack workspace that lets teams and coding agents build, test, and ship applications on their own infrastructure."

[params.schema.contactPoint]
contactType = "sales and support"
url = "https://taubyte.com/contact"
availableLanguage = ["en"]

[[params.schema.faq]]
question = "What is Taubyte?"
answer = "Taubyte is a full-stack workspace for building, testing, and shipping applications on infrastructure you control."

[[params.schema.faq]]
question = "Who is the Taubyte Blog for?"
answer = "The blog is written for developers, platform teams, operators, and technical leaders evaluating distributed cloud, local development, WebAssembly, and AI-era software delivery."

[[params.schema.faq]]
question = "How does Taubyte use Git?"
answer = "Git is the control path for projects, resources, code, configuration, builds, and deployments, so changes remain reviewable and traceable."

[[params.schema.faq]]
question = "Can Taubyte run locally before production?"
answer = "Yes. Taubyte uses Dream to run a local cloud environment that mirrors production behavior for development and testing."

[[params.schema.faq]]
question = "Where can readers learn more?"
answer = "Readers can use the Taubyte documentation at tau.how, the GitHub organization, the community Discord, or the contact page on taubyte.com."

[params.analytics.google]
SiteVerificationTag = "XYZabc"

[params.analytics.bing]
SiteVerificationTag = "XYZabc"

[params.analytics.yandex]
SiteVerificationTag = "XYZabc"

[params.cover]
hidden = true # hide everywhere but not in structured data
hiddenInList = true # hide in list pages and home
hiddenInSingle = true # hide in single page

[params.editPost]
URL = "https://github.com/taubyte/blog/issues/new?title=[post-suggestion]&body=Please%20describe%20the%20changes%20you%20suggest%20for%20this%20blog%20post.%0A%0APost:%20"
Text = "Suggest Changes" # edit text
appendFilePath = true # append file path to help identify the post

# for search
# https://fusejs.io/api/options.html
[params.fuseOpts]
isCaseSensitive = false
shouldSort = true
location = 0
distance = 1000
threshold = 0.4
minMatchCharLength = 0
keys = ["title", "permalink", "summary", "content"]

[menu]
[[menu.main]]
identifier = "categories"
name = "Categories"
url = "/categories/"
weight = 10

[[menu.main]]
identifier = "tags"
name = "Tags"
url = "/tags/"
weight = 20

[[menu.main]]
identifier = "docs"
name = "Documentation"
url = "https://tau.how"
weight = 30

[[menu.main]]
identifier = "website"
name = "Website"
url = "https://taubyte.com"
weight = 40

# Post sorting - show latest posts first (Hugo sorts by date descending by default)
[sections]
  [sections.posts]
    sortBy = "date"

# Read: https://github.com/adityatelange/hugo-PaperMod/wiki/FAQs#using-hugos-syntax-highlighter-chroma
pygmentsUseClasses = true
[markup.highlight]
noClasses = false
# anchorLineNos = true
# codeFences = true
# guessSyntax = true
# lineNos = true
# style = "github"
